<title>MKT Audit SOP Mobile</title>

<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Terang saja (tanpa mode gelap). Gaya mengikuti WMS (Ant Design, Plus Jakarta Sans): topbar putih, sidebar/drawer, kartu radius 12, header tabel krem. HP dulu: kartu per langkah. */
:root{
  color-scheme:light;
  --bg:#FAFAFA; --surface:#FFFFFF; --line:#E7E7E7; --line2:#DCDCDC;
  --fg:#0A0A0A; --muted:#6B6B70; --faint:#9A9AA0;
  --brand:#ED1C24; --brand-bg:#FFF1F2; --brand-fg:#FFFFFF;
  --accent:#FDB913; --thead-bg:#FFFBEB; --thead-fg:#461902;
  --ok:#2A9D6F; --ok-bg:#EAF6F0; --nc:#ED1C24; --nc-bg:#FFF1F2; --na:#595959; --na-bg:#F5F5F5;
  --pend:#8A5A00; --pend-bg:#FFF6DA; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px; --rl:12px; --pill:40px; --h:40px; --on-sem:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.err{background:var(--nc-bg);color:var(--nc);border-radius:var(--r);padding:10px 12px;font-size:13px;font-weight:600}
.saved.pending{color:var(--muted)}.saved.err{color:var(--nc)}
.by{color:var(--faint);font-size:11.5px}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;height:64px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--na-bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-fg);font-weight:700;font-size:12px;display:grid;place-items:center;letter-spacing:.02em}
.brand b{font-size:15px;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap}
.top .sp{flex:1}
.user{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;min-width:0}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--brand-bg);color:var(--brand);font-weight:700;display:grid;place-items:center;flex:none}
.user .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
@media (max-width:560px){.user .em,.brand span{display:none}}

.shell{display:flex;min-height:calc(100% - 64px)}
.nav{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
.nav h6{margin:14px 12px 6px;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:var(--r);color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--na-bg)}
.nav a.on{background:var(--brand-bg);color:var(--brand)}
.nav a.dis{color:var(--faint);pointer-events:none}
.nav svg{flex:none}
.scrim{display:none}
@media (max-width:1023px){
  .nav{position:fixed;z-index:40;top:0;bottom:0;left:0;width:300px;max-width:86vw;transform:translateX(-102%);transition:transform .2s ease;
    padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));box-shadow:0 0 40px rgba(0,0,0,.2)}
  .nav.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45)}
}
.navhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
@media (min-width:1024px){#menuBtn{display:none}.navhead{display:none}}
.navhead b{font-size:15px}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}

main{flex:1;min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--brand)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:clamp(26px,4.2vw,38px);line-height:1.2;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{height:var(--h);padding:0 18px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--surface);border-color:var(--brand);color:var(--brand)}
.btn.pri:hover{background:var(--brand-bg);color:var(--brand)}
.btn.solid{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.solid:hover{filter:brightness(.95);color:var(--brand-fg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.block{width:100%;white-space:normal;height:auto;min-height:var(--h);padding-block:10px;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.mock{font-size:12px;color:var(--pend);background:var(--pend-bg);border-radius:var(--r);padding:8px 12px}

.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-draft{background:var(--pend-bg);color:var(--pend)} .p-final{background:var(--ok-bg);color:var(--ok)}
.p-ex{background:var(--na-bg);color:var(--na)} .p-opt{background:var(--na-bg);color:var(--na)}
.p-C{background:var(--ok-bg);color:var(--ok)} .p-NC{background:var(--nc-bg);color:var(--nc)} .p-NA{background:var(--na-bg);color:var(--na)} .p-P{background:var(--pend-bg);color:var(--pend)}

/* daftar dokumen */
.docs{display:flex;flex-direction:column}
.doc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
.doc:last-child{border-bottom:0}.doc:hover{background:var(--bg)}
.doc .no{font-weight:700;font-variant-numeric:tabular-nums}
.doc .meta{color:var(--muted);font-size:12.5px;grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap}
.bar{height:6px;border-radius:999px;background:var(--na-bg);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.thead{background:var(--thead-bg);color:var(--thead-fg);font-weight:600;font-size:12.5px;padding:12px 16px;border-radius:var(--rl) var(--rl) 0 0;border-bottom:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600}
.f small{color:var(--muted);font-size:12px}
.in{height:var(--h);border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);padding:0 12px;width:100%}
textarea.in{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-bg)}
.in[readonly]{background:var(--bg);color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.chk small{display:block;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:16px}}
.sheet h2{margin:0;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* bagian */
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.part{text-align:left;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--shadow)}
.part:hover{border-color:var(--brand)}
.part h3{margin:0;font-size:15px}
.part .k{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.part .warn{color:var(--nc);font-size:12px;font-weight:600}
.dochead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.dochead{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.02em}
.kv b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* isi audit */
.sub{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);margin:-20px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sub .in2{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.subrow{display:flex;align-items:center;gap:10px;min-width:0}
.subrow .t{flex:1;min-width:0}
.subrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subrow .t small{color:var(--muted);font-size:12px}
.saved{font-size:11.5px;color:var(--ok);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}
.chip .c{color:var(--muted);font-weight:500}.chip.on .c{color:inherit}
.seg2{display:flex;gap:6px}
.sechead{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sechead b{font-size:15px}
.sechead small{color:var(--muted)}
.step{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.step.need{border-color:var(--nc)}
.sh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--thead-bg);color:var(--thead-fg);font-weight:700;font-size:12.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.step.done .num{background:var(--ok-bg);color:var(--ok)}
.crit{font-weight:600;line-height:1.45}
.sm{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px;margin-top:4px}
.ans{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;align-items:center}
.ans > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:44px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"].C{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].NC{background:var(--nc-bg);border-color:var(--nc);color:var(--nc)}
.seg button[aria-pressed="true"].NA{background:var(--na-bg);border-color:var(--na);color:var(--fg)}
.seg button[disabled]{opacity:.55;cursor:default}
.seg button[disabled][aria-pressed="true"]{opacity:1}
.prev{font-size:12px;color:var(--muted);background:var(--bg);border:1px dashed var(--line2);border-radius:var(--r);padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.prev q{color:var(--fg);quotes:"“" "”"}
.more{display:flex;gap:8px;flex-wrap:wrap}
.lnk{border:0;background:transparent;color:var(--brand);font-weight:600;font-size:12.5px;padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.need-msg{color:var(--nc);font-size:12px;font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:12px;line-height:1}
.locked{background:var(--ok-bg);color:var(--ok);border-radius:var(--r);padding:10px 12px;font-weight:600;font-size:13px}

/* ringkasan */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--thead-bg);color:var(--thead-fg);font-weight:600;font-size:12.5px;text-align:left;padding:12px 14px;white-space:nowrap}
th:first-child{border-top-left-radius:var(--rl)}th:last-child{border-top-right-radius:var(--rl)}
td{padding:12px 14px;border-top:1px solid var(--line);white-space:nowrap}
td.l{white-space:normal;min-width:140px}
th.r,td.r{text-align:right}
.big{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis .card{padding:14px 16px}
.kpis small{color:var(--muted);font-size:12px}
.nclist{display:flex;flex-direction:column}
.nclist div{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nclist div:first-child{border-top:0}
.nclist small{color:var(--muted)}
.alert{border-radius:var(--rl);padding:12px 16px;background:var(--nc-bg);color:var(--nc);font-weight:600;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:60;max-width:90vw}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:18;display:flex;gap:8px}
.fab .btn{box-shadow:0 6px 20px rgba(0,0,0,.18)}
/* ruang kerja putih seperti WMS (desktop/tablet) */
@media (min-width:768px){
  main{padding-block:8px 48px;padding-left:8px;padding-right:8px}
  .wrap{max-width:none;background:var(--surface);border-radius:var(--rl);box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.04);padding:24px 24px 32px;min-height:calc(100vh - 88px)}
  .wrap > *{width:100%;max-width:900px;margin-left:auto;margin-right:auto}
  .wrap .card{box-shadow:none}
  .sub{margin:-24px -24px 0;padding:16px 24px 12px;border-radius:var(--rl) var(--rl) 0 0;background:var(--surface);max-width:none;width:auto}
  .sub .in2{max-width:900px}
}
.pill.p-hist{background:#F5F5F5;color:#595959}
.pill.p-mdn{background:#FFF8E1;color:#8A5A00}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:16px 0 0}
.navlink{display:flex;align-items:center;gap:10px}
</style>

  <div class="brand"><div class="logo">MKT</div><div><b>Audit SOP</b> <span>Warehouse &amp; Multimode</span></div></div>

</header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Navigasi">

    <a href="#" data-v="ringkasan" id="navSum"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Ringkasan</a>

  </nav>

<script>
/* MKT Audit SOP — logika halaman. Server: Code.gs (google.script.run). DATA: Data.html. */
const LBL = {C:'Comply', NC:'Non-comply', NA:'N/A', P:'Belum diaudit'};
const SHORT = {C:'C', NC:'NC', NA:'N/A', P:'Pending'};
const SHEETNAME = {TRUCKING:'Trucking Support', EXPORT:'Export', IMPORT:'Import', DC:'Distribution Center', CY:'CY Handling'};
const CAT = {DOC:'Dokumen', OPS:'Operasional', SYS:'Sistem/WMS', COMP:'Kepatuhan'};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const site = c => DATA.sites.find(s => s.code === c);
const sheetOf = (c, sh) => DATA.sheets.find(s => s.site === c && s.sheet === sh);

/* ---------- server ---------- */
function API(fn, ...args){
  return new Promise((res, rej) => google.script.run
    .withSuccessHandler(res)
    .withFailureHandler(e => rej(new Error((e && e.message) || String(e) || 'Koneksi ke server gagal.')))[fn](...args));
}

/* ---------- state ---------- */
const S = {user:null, docs:[], nextNo:'', D:null, part:null, sec:null, view:'dokumen'};
const canWrite = () => S.user && (S.user.peran === 'admin' || S.user.peran === 'auditor');
const isLocked = () => !S.D || S.D.doc.status === 'final' || !canWrite();

/* ---------- logika audit (sama dengan Code.gs) ---------- */
function parts(doc){
  const s = site(doc.site), out = [];
  for (const sh of s.sheets){
    if (sh === 'CY' && !doc.cy) continue;
    const units = (s.units || {})[sh];
    if (units && units.length) units.forEach(u => out.push({key: sh + '|' + u, sheet: sh, unit: u, label: SHEETNAME[sh] + ' · ' + u}));
    else out.push({key: sh, sheet: sh, unit: null, label: SHEETNAME[sh]});
  }
  return out;
}
function partItems(doc, p){
  const sh = sheetOf(doc.site, p.sheet);
  const secs = sh.sections.filter(x => !(x.opt && !(p.sheet === 'CY' ? doc.cy : doc.full)));
  const ids = new Set(secs.map(x => x.id));
  return {secs, items: sh.items.filter(i => ids.has(i.s))};
}
const prevOf = (item, p) => p.unit ? (item.p[p.unit.toLowerCase()] || {}) : item.p;
const ansOf = (p, n) => (S.D.ans[p.key] || {})[n] || {};
const isDone = a => !!(a.d && a.g);
const needsNote = a => (a.d === 'NC' || a.g === 'NC') && !String(a.f || '').trim() && !(S.D && isHist(S.D.doc)); // data impor lama tidak ditagih temuan
function stats(p){
  const {items} = partItems(S.D.doc, p); const t = {total: items.length, done:0, C:0, NC:0, NA:0, need:0, ncd:0};
  for (const i of items){ const a = ansOf(p, i.n);
    if (isDone(a)) t.done++; if (a.g === 'C') t.C++; if (a.g === 'NC') t.NC++; if (a.g === 'NA') t.NA++;
    if (a.d === 'NC') t.ncd++; if (needsNote(a)) t.need++; }
  t.pct = (t.C + t.NC) ? t.C/(t.C + t.NC) : null; return t;
}
function docStats(){
  const t = {total:0, done:0, C:0, NC:0, NA:0, need:0, ncd:0};
  parts(S.D.doc).forEach(p => { const s = stats(p); for (const k in t) t[k] += s[k]; });
  t.pct = (t.C + t.NC) ? t.C/(t.C + t.NC) : null; return t;
}
const pctTxt = v => v == null ? '–' : (v*100).toFixed(1).replace('.', ',') + '%';
const MON = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})(?:\/(\d{2}))?$/.exec(String(s || ''));
  return m ? (+m[3]) + (m[4] ? '–' + (+m[4]) : '') + ' ' + MON[+m[2]-1] + ' ' + m[1] : String(s || ''); };
const isHist = d => String(d.id).indexOf('hist-') === 0;
const isMdn = d => (site(d.site) || {}).template === 'MDN_TEMPLATE';
const sopTxt = d => isMdn(d) ? 'SOP cabang Medan' : 'SOP Utama (Head Office)';
const timeTxt = t => new Date(t).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

/* ---------- antrean simpan (otomatis, dengan cadangan di HP) ---------- */
let Q = {}, inflight = false, qTimer = null, fatal = '';
const qKey = () => 'mkt-audit-q-' + (S.D ? S.D.doc.id : '');
function backup(){ try { if (S.D) localStorage.setItem(qKey(), JSON.stringify(Q)); } catch(e){} }
function restoreBackup(){
  try { const v = JSON.parse(localStorage.getItem(qKey()) || '{}');
    for (const k in v){ const x = v[k]; Q[k] = x; const a = (S.D.ans[x.part] = S.D.ans[x.part] || {})[x.no] || {};
      S.D.ans[x.part][x.no] = Object.assign(a, x); }
    if (Object.keys(Q).length){ toast('Isian yang belum terkirim dipulihkan dan dikirim ulang'); schedule(300); }
  } catch(e){}
}
function setSaved(state, msg){
  const el = $('#saved'); if (!el) return;
  el.className = 'saved ' + (state === 'ok' ? '' : state);
  el.textContent = state === 'ok' ? 'Tersimpan ' + timeTxt(S.D.doc.upd || Date.now())
    : state === 'pending' ? 'Menyimpan…' : 'Belum tersimpan' + (msg ? ': ' + msg : '');
}
function schedule(ms){ clearTimeout(qTimer); qTimer = setTimeout(flush, ms); }
function queue(p, n, patch){
  const k = p.key + '|' + n;
  Q[k] = Object.assign(Q[k] || {part: p.key, no: n}, patch);
  backup(); setSaved('pending'); schedule(900);
}
async function flush(){
  if (inflight || fatal || !S.D || !Object.keys(Q).length) return;
  inflight = true; const batch = Q; Q = {}; const id = S.D.doc.id;
  try {
    const r = await API('apiSave', id, Object.values(batch));
    if (S.D && S.D.doc.id === id){ S.D.doc.upd = r.t; setSaved('ok'); }
  } catch(e){
    for (const k in batch) Q[k] = Object.assign({}, batch[k], Q[k] || {});
    if (/terdaftar|dikunci/.test(e.message)){ fatal = e.message; toast(e.message); }
    setSaved('err', fatal ? '' : 'sinyal/server, dicoba lagi');
    if (!fatal) schedule(5000);
  } finally {
    inflight = false; backup();
    if (Object.keys(Q).length && !fatal) schedule(1200);
  }
}
async function drain(){
  for (let i = 0; i < 40 && (inflight || Object.keys(Q).length); i++){
    if (!inflight) await flush(); await new Promise(r => setTimeout(r, 250));
    if (fatal) break;
  }
  if (Object.keys(Q).length) throw new Error('Masih ada isian yang belum tersimpan. Periksa sinyal lalu coba lagi.');
}
window.addEventListener('beforeunload', e => { if (inflight || Object.keys(Q).length){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- navigasi ---------- */
function go(v, push){
  if (['layanan','isi','ringkasan'].includes(v) && !S.D) v = 'dokumen';
  if (v === 'isi' && !curPart()) v = 'layanan';
  S.view = v;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v || (v === 'isi' && a.dataset.v === 'layanan')));
  $('#navDoc').classList.toggle('dis', !S.D); $('#navSum').classList.toggle('dis', !S.D);
  closeNav();
  ({dokumen:vDocs, layanan:vParts, isi:vFill, ringkasan:vSum, bantuan:vHelp})[v]();
  if (v !== 'isi') window.scrollTo(0, 0);
  if (push !== false) try { google.script.history.push({v}, {}, v); } catch(e){}
}
const curPart = () => S.D && parts(S.D.doc).find(p => p.key === S.part);
function loading(msg){ $('#view').innerHTML = `<div class="loading">${esc(msg || 'Memuat…')}</div>`; }
function failView(e, retry){
  $('#view').innerHTML = `<div class="err">${esc(e.message)}</div><div class="row" style="justify-content:flex-start"><button class="btn" id="retry" type="button">Coba lagi</button></div>`;
  $('#retry').onclick = retry;
}
async function openDoc(id, view){
  loading('Membuka dokumen…');
  try { await drain(); } catch(e){}
  try { S.D = await API('apiGetDoc', id); fatal = ''; Q = {}; restoreBackup(); go(view || 'layanan'); }
  catch(e){ failView(e, () => openDoc(id, view)); }
}
async function refreshDoc(){ // ambil isian auditor lain tanpa membuang antrean lokal
  if (!S.D) return; const id = S.D.doc.id;
  try { const r = await API('apiGetDoc', id); if (!S.D || S.D.doc.id !== id) return;
    for (const k in Q){ const x = Q[k]; const a = (r.ans[x.part] = r.ans[x.part] || {})[x.no] || {}; r.ans[x.part][x.no] = Object.assign(a, x); }
    S.D = r; if (S.view === 'layanan') vParts(); } catch(e){}
}

/* ---------- daftar dokumen ---------- */
async function vDocs(){
  loading('Memuat dokumen audit…');
  try { await drain(); } catch(e){}
  try { const r = await API('apiBootstrap'); S.user = r.user; S.docs = r.docs; S.nextNo = r.nextNo; showUser(); }
  catch(e){ return failView(e, vDocs); }
  if (S.view !== 'dokumen') return;
  const row = d => {
    const s = site(d.site), t = d.sum, h = isHist(d), pr = t.total ? Math.round((h ? t.C+t.NC+t.NA : t.done)/t.total*100) : 0, pct = (t.C+t.NC) ? t.C/(t.C+t.NC) : null;
    return `<button class="doc" data-doc="${esc(d.id)}" type="button">
      <span class="no">${esc(d.no)}</span>
      <span>${isMdn(d) ? '<span class="pill p-mdn">SOP Medan</span> ' : ''}<span class="pill ${d.status === 'final' ? 'p-final">Final' : 'p-draft">Draft'}</span></span>
      <span class="meta"><span><b>${esc(s ? s.name : d.site)}</b></span><span>${fmtDate(d.date)}</span>
        <span>${h ? (t.C+t.NC+t.NA) + ' langkah diaudit' : t.done + '/' + t.total + ' langkah'}</span><span>Lapangan comply ${pctTxt(pct)}</span><span>${esc(d.leadName || '')}</span></span>
      <span class="bar"><i style="width:${pr}%"></i></span></button>`; };
  const byUpd = (a,b) => (b.upd||0) - (a.upd||0);
  const now = S.docs.filter(d => !isHist(d)).sort(byUpd), old = S.docs.filter(isHist).sort((a,b) => String(a.no).localeCompare(String(b.no)));
  $('#view').innerHTML = `
    <div class="ph"><div><h1>Dokumen Audit</h1><p>Satu dokumen per kunjungan audit cabang, dengan nomor formulir sendiri.</p></div>
      ${canWrite() ? '<button class="btn pri" id="newBtn" type="button">+ Buat dokumen audit</button>' : ''}</div>
    ${canWrite() ? '' : `<div class="err">Akun ${esc(S.user.email)} belum terdaftar sebagai auditor, jadi hanya bisa melihat. Minta admin menambahkan email ini di sheet PENGGUNA.</div>`}
    <div class="card"><div class="thead">Audit berjalan</div>
      <div class="docs">${now.map(row).join('') || `<div class="empty">Belum ada dokumen audit baru.${canWrite() ? ' Tekan <b>Buat dokumen audit</b> untuk mulai.' : ''}</div>`}</div></div>
    <div class="card"><div class="thead">Audit Juli–September 2026 (impor)</div>
      <div class="docs">${old.map(row).join('') || '<div class="empty">Data audit sebelumnya belum diimpor. Admin bisa menjalankan setup() sekali lagi.</div>'}</div></div>
    <p class="foot">© 2026 MKT · Audit SOP Warehouse &amp; Multimode</p>`;
  const nb = $('#newBtn'); if (nb) nb.onclick = openNew;
  document.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => { S.part = null; openDoc(b.dataset.doc); });
}
function openNew(){
  const today = new Date(Date.now() + 7*3600e3).toISOString().slice(0,10);
  $('#layer').innerHTML = `<div class="sheet" id="sheet"><form class="card" id="newForm" novalidate>
    <h2>Buat dokumen audit</h2>
    <div class="fgrid">
      <div class="f"><label for="fNo">No. formulir</label><input class="in" id="fNo" readonly value="${esc(S.nextNo)}"><small>Nomor final diberikan server saat disimpan.</small></div>
      <div class="f"><label for="fSite">Cabang</label><select class="in" id="fSite">${DATA.sites.map(s => `<option value="${s.code}">${esc(s.name)}</option>`).join('')}</select></div>
      <div class="f"><label for="fDate">Tanggal audit</label><input class="in" type="date" id="fDate" value="${today}"></div>
      <div class="f"><label for="fAud">Lead auditor</label><input class="in" id="fAud" readonly value="${esc(S.user.nama)}"><small>${esc(S.user.email)}</small></div>
      <div class="f full"><label for="fPartner">Auditor pendamping (opsional)</label><input class="in" id="fPartner" placeholder="Nama auditor kedua"></div>
      <div class="f full"><span style="font-size:12.5px;font-weight:600">Bagian yang disiapkan, belum pernah diaudit</span>
        <label class="chk"><input type="checkbox" id="fCy"><span>CY Handling<small id="cyNote"></small></span></label>
        <label class="chk" id="fullRow"><input type="checkbox" id="fFull"><span>Penarikan full container (Trucking)<small>Checklist dari draf Rev.02, langkah 9–18.</small></span></label>
        <small>Pilihan ini tidak bisa diubah setelah dokumen dibuat.</small></div>
    </div>
    <div id="newErr"></div>
    <div class="row"><button class="btn ghost" type="button" id="cancel">Batal</button><button class="btn pri" type="submit" id="mk">Buat dokumen</button></div>
  </form></div>`;
  const sync = () => { const c = $('#fSite').value, s = site(c);
    $('#fullRow').hidden = !s.sheets.includes('TRUCKING'); if (!s.sheets.includes('TRUCKING')) $('#fFull').checked = false;
    $('#fCy').checked = c === 'MDN';
    $('#cyNote').textContent = c === 'MDN' ? 'Medan sudah diaudit Agustus (27 langkah SOP Medan).' : 'Checklist dari draf SOP-OPS-CY-001, 15 langkah.'; };
  $('#fSite').onchange = sync; sync();
  const close = () => $('#layer').innerHTML = '';
  $('#cancel').onclick = close;
  $('#sheet').onclick = e => { if (e.target.id === 'sheet') close(); };
  $('#newForm').onsubmit = async e => { e.preventDefault();
    const btn = $('#mk'); btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      const r = await API('apiCreateDoc', {site: $('#fSite').value, date: $('#fDate').value, partner: $('#fPartner').value.trim(), cy: $('#fCy').checked, full: $('#fFull').checked});
      close(); S.D = r; Q = {}; fatal = ''; S.part = null; toast('Dokumen ' + r.doc.no + ' dibuat'); go('layanan');
    } catch(err){ $('#newErr').innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; btn.textContent = 'Buat dokumen'; }
  };
}

/* ---------- bagian dalam dokumen ---------- */
function docHead(){
  const d = S.D.doc, s = site(d.site);
  return `<div class="card pad dochead">
    <div class="kv"><small>No. formulir</small><b>${esc(d.no)}</b></div>
    <div class="kv"><small>Cabang</small><b>${esc(s.name)}</b></div>
    <div class="kv"><small>Tanggal</small><b>${fmtDate(d.date)}</b></div>
    <div class="kv"><small>Status</small><b><span class="pill ${d.status === 'final' ? 'p-final">Final, terkunci' : 'p-draft">Draft'}</span></b></div>
    <div class="kv"><small>SOP acuan</small><b>${sopTxt(d)}</b></div>
    <div class="kv"><small>Lead auditor</small><b>${esc(d.leadName || '–')}</b></div>
    ${isHist(d) ? '<div class="kv" style="grid-column:span 2"><small>Sumber</small><b>Impor hasil audit 2026 (FRM-OPS-001-0001 s.d. 0005)</b></div>' : ''}</div>`;
}
function vParts(){
  const d = S.D.doc, s = site(d.site);
  const cards = parts(d).map(p => { const t = stats(p), pr = t.total ? Math.round(t.done/t.total*100) : 0;
    const never = sheetOf(d.site, p.sheet).items.every(i => (prevOf(i,p).g || 'P') === 'P');
    return `<button class="part" data-part="${p.key}" type="button">
      <h3>${esc(p.label)}</h3>
      ${never ? '<span class="pill p-opt" style="align-self:flex-start">Disiapkan, belum pernah diaudit</span>' : ''}
      <div class="k"><span>${isHist(d) ? (t.C+t.NC+t.NA) + ' langkah diaudit' : t.done + '/' + t.total + ' langkah'}</span><span>Comply ${pctTxt(t.pct)}</span></div>
      <div class="bar"><i style="width:${pr}%"></i></div>
      ${t.need ? `<span class="warn">${t.need} NC belum ada temuan</span>` : ''}</button>`; }).join('');
  $('#view').innerHTML = `
    <div class="crumb"><a href="#" data-go="dokumen">Dokumen audit</a><span>/</span><span>${esc(d.no)}</span></div>
    <div class="ph"><div><h1>${esc(s.name)}</h1><p>${isHist(d) ? 'Hasil audit ' + fmtDate(d.date) + '. Hanya bisa dibaca.' : 'Pilih layanan untuk mulai mengisi. Dua auditor bisa mengisi layanan berbeda bersamaan.'}${isMdn(d) ? ' Langkah audit memakai SOP cabang Medan.' : ''}</p></div>
      <button class="btn" type="button" data-go="ringkasan">Lihat ringkasan</button></div>
    ${docHead()}
    <div class="parts">${cards}</div>`;
  document.querySelectorAll('[data-part]').forEach(b => b.onclick = () => { S.part = b.dataset.part; S.sec = null; go('isi'); });
}

/* ---------- isi audit ---------- */
let filt = 'all';
function vFill(){
  const d = S.D.doc, p = curPart(), {secs, items} = partItems(d, p), lock = isLocked();
  if (!secs.find(x => x.id === S.sec)) S.sec = secs[0].id;
  const t = stats(p), s = site(d.site);
  const chips = secs.map(x => { const its = items.filter(i => i.s === x.id), dn = its.filter(i => isDone(ansOf(p,i.n))).length;
    return `<button class="chip ${x.id === S.sec ? 'on' : ''}" data-sec="${x.id}" type="button">${esc(x.id)} <span class="c">${dn}/${its.length}</span></button>`; }).join('');
  const sec = secs.find(x => x.id === S.sec);
  let list = items.filter(i => i.s === sec.id);
  if (filt === 'todo') list = list.filter(i => !isDone(ansOf(p,i.n)));
  if (filt === 'nc') list = list.filter(i => { const a = ansOf(p,i.n); return a.d === 'NC' || a.g === 'NC'; });
  const pr = t.total ? Math.round(t.done/t.total*100) : 0;
  const ix = secs.indexOf(sec), nx = secs[ix + 1];
  $('#view').innerHTML = `
    <div class="sub"><div class="in2">
      <div class="subrow"><button class="iconbtn" data-go="layanan" aria-label="Kembali ke daftar layanan" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="t"><b>${esc(p.label)} · ${esc(s.name)}</b><small id="subcount">${esc(d.no)} · ${t.done}/${t.total} langkah</small></div>
        <span class="saved" id="saved"></span></div>
      <div class="bar"><i id="subbar" style="width:${pr}%"></i></div>
      <div class="chips" role="tablist" aria-label="Tahap">${chips}</div>
    </div></div>
    ${S.D.doc.status === 'final' ? '<div class="locked">Dokumen sudah dikunci. Isian hanya bisa dibaca.</div>' : (!canWrite() ? '<div class="err">Mode lihat saja: akun belum terdaftar sebagai auditor.</div>' : '')}
    <div class="sechead"><b>${esc(sec.name)}</b><small>${esc(sec.sop)}${sec.opt ? ' · disiapkan, belum pernah diaudit' : ''}</small></div>
    <div class="seg2" role="group" aria-label="Saring langkah">
      ${[['all','Semua'],['todo','Belum lengkap'],['nc','Ada NC']].map(([k,l]) => `<button class="chip ${filt === k ? 'on' : ''}" data-f="${k}" type="button">${l}</button>`).join('')}</div>
    <div id="steps" style="display:flex;flex-direction:column;gap:12px">${list.map(i => stepCard(p, i, lock)).join('') || '<div class="card empty">Tidak ada langkah dengan saringan ini.</div>'}</div>
    ${nx ? `<button class="btn block" id="nextSec" data-to="${nx.id}" type="button">Lanjut ke ${esc(nx.id)} · ${esc(nx.name)} →</button>`
         : `<button class="btn pri block" type="button" data-go="layanan">Selesai di layanan ini</button>`}`;
  if (Object.keys(Q).length) setSaved('pending'); else if (S.D.doc.upd) setSaved('ok');
  document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { S.sec = b.dataset.sec; vFill(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filt = b.dataset.f; vFill(); });
  const nb = $('#nextSec'); if (nb) nb.onclick = () => { S.sec = nb.dataset.to; vFill(); window.scrollTo(0,0); };
  bindSteps(p, lock);
  const on = document.querySelector('.chip.on[data-sec]'); if (on) on.scrollIntoView({inline:'center', block:'nearest'});
}
function segBtns(n, field, val, lock){
  return `<div class="seg" role="group">${['C','NC','NA'].map(k => `<button type="button" class="${k}" data-n="${n}" data-field="${field}" data-v="${k}" aria-pressed="${val === k}" ${lock ? 'disabled' : ''}>${k === 'C' ? '✓ C' : k === 'NC' ? '✕ NC' : 'N/A'}</button>`).join('')}</div>`;
}
function stepCard(p, i, lock){
  const a = ansOf(p, i.n), pv = prevOf(i, p), s = site(S.D.doc.site), need = needsNote(a);
  const prev = isHist(S.D.doc) ? '' : pv.g && pv.g !== 'P'
    ? `<div class="prev"><span>Audit ${esc(s.date)}:</span>${pv.d && pv.d !== 'P' ? `<span class="pill p-${pv.d}">Dok ${SHORT[pv.d]}</span>` : ''}<span class="pill p-${pv.g}">Lap ${SHORT[pv.g]}</span>${pv.f ? `<q>${esc(pv.f)}</q>` : ''}</div>`
    : `<div class="prev"><span class="pill p-P">Belum pernah diaudit</span></div>`;
  const open = a.f || a.a || (a.ph && a.ph.length) || need;
  return `<article class="card step ${isDone(a) ? 'done' : ''} ${need ? 'need' : ''}" id="st${i.n}">
    <div class="sh"><span class="num">${i.n}</span><div style="min-width:0"><div class="crit">${esc(i.c)}</div>
      <div class="sm"><span>PIC: ${esc(i.a)}</span><span>${esc(i.r)}</span><span>${CAT[i.k] || esc(i.k)}</span></div>
      ${a.by && a.t && !isHist(S.D.doc) ? `<div class="by">Diisi ${esc(String(a.by).split('@')[0])} · ${timeTxt(a.t)}</div>` : ''}</div></div>
    <div class="ans"><span>Dokumen</span>${segBtns(i.n, 'd', a.d, lock)}<span>Lapangan</span>${segBtns(i.n, 'g', a.g, lock)}</div>
    ${prev}
    <div class="extra" data-x="${i.n}" ${open ? '' : 'hidden'}>
      <div class="f"><label for="f${i.n}">Temuan${(a.d === 'NC' || a.g === 'NC') ? ' (wajib untuk NC)' : ''}</label>
        <textarea class="in" id="f${i.n}" data-n="${i.n}" data-field="f" rows="2" maxlength="2000" placeholder="Apa yang dilihat di lapangan atau di dokumen" ${lock ? 'readonly' : ''}>${esc(a.f)}</textarea>
        ${need ? '<span class="need-msg">Isi temuan untuk langkah NC ini.</span>' : ''}</div>
      <div class="f" style="margin-top:10px"><label for="a${i.n}">Pelaksana aktual (isi bila beda dari PIC SOP)</label>
        <input class="in" id="a${i.n}" data-n="${i.n}" data-field="a" value="${esc(a.a)}" maxlength="200" placeholder="${esc(i.a)}" ${lock ? 'readonly' : ''}></div>
      <div class="f" style="margin-top:10px"><label>Foto (opsional, maks. 3)</label>
        <div class="thumbs">${(a.ph || []).map((q, k) => `<figure><a href="${esc(q.url)}" target="_blank" rel="noopener"><img src="${q.th || ''}" alt="Foto langkah ${i.n}"></a><button type="button" data-delph="${i.n}" data-k="${k}" aria-label="Hapus foto" ${lock ? 'hidden' : ''}>✕</button></figure>`).join('')}</div>
        ${lock || (a.ph || []).length >= 3 ? '' : `<label class="lnk" for="ph${i.n}" id="phl${i.n}">+ Tambah foto</label><input type="file" id="ph${i.n}" data-ph="${i.n}" accept="image/*" capture="environment" hidden>`}</div>
    </div>
    ${open ? '' : `<div class="more"><button class="lnk" type="button" data-open="${i.n}">+ Temuan, pelaksana, foto</button></div>`}
  </article>`;
}
function setAns(p, n, patch){
  S.D.ans[p.key] = S.D.ans[p.key] || {};
  S.D.ans[p.key][n] = Object.assign(S.D.ans[p.key][n] || {}, patch, {t: Date.now(), by: S.user.email});
  queue(p, n, patch);
}
function bindSteps(p, lock){
  const box = $('#steps'); if (lock) return;
  box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.field){ const n = b.dataset.n, cur = ansOf(p, n)[b.dataset.field];
      setAns(p, n, {[b.dataset.field]: cur === b.dataset.v ? null : b.dataset.v}); refreshStep(p, n); return; }
    if (b.dataset.open){ const n = b.dataset.open; $(`[data-x="${n}"]`).hidden = false; b.parentElement.remove(); return; }
    if (b.dataset.delph){ const n = b.dataset.delph, ph = (ansOf(p,n).ph || []).slice(); ph.splice(+b.dataset.k, 1); setAns(p, n, {ph}); refreshStep(p, n); }
  };
  box.oninput = e => { const el = e.target; if (el.dataset.field === 'f' || el.dataset.field === 'a') setAns(p, el.dataset.n, {[el.dataset.field]: el.value}); };
  box.onchange = e => { const el = e.target;
    if (el.dataset.field === 'f') refreshStep(p, el.dataset.n);
    if (el.dataset.ph && el.files[0]) addPhoto(p, el.dataset.ph, el.files[0]); };
}
function refreshStep(p, n){
  const i = sheetOf(S.D.doc.site, p.sheet).items.find(x => String(x.n) === String(n));
  const old = $('#st' + n); if (!old) return;
  const tmp = document.createElement('div'); tmp.innerHTML = stepCard(p, i, isLocked());
  old.replaceWith(tmp.firstElementChild);
  const t = stats(p);
  $('#subcount').textContent = `${S.D.doc.no} · ${t.done}/${t.total} langkah`;
  $('#subbar').style.width = (t.total ? Math.round(t.done/t.total*100) : 0) + '%';
  const its = partItems(S.D.doc, p).items.filter(x => x.s === i.s), dn = its.filter(x => isDone(ansOf(p,x.n))).length;
  const ch = document.querySelector(`[data-sec="${i.s}"] .c`); if (ch) ch.textContent = `${dn}/${its.length}`;
}
function resize(img, max, q){
  const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q);
}
function addPhoto(p, n, file){
  const img = new Image(), url = URL.createObjectURL(file), lbl = $('#phl' + n);
  if (lbl) lbl.textContent = 'Mengunggah foto…';
  img.onload = async () => {
    const full = resize(img, 1600, .8), th = resize(img, 200, .6); URL.revokeObjectURL(url);
    try { await drain(); const q = await API('apiUploadPhoto', S.D.doc.id, p.key, n, full, th);
      const ph = (ansOf(p,n).ph || []).concat(q).slice(0, 3); setAns(p, n, {ph}); refreshStep(p, n); toast('Foto tersimpan di Drive'); }
    catch(e){ toast('Foto gagal diunggah: ' + e.message); if (lbl) lbl.textContent = '+ Tambah foto'; }
  };
  img.onerror = () => { toast('File ini tidak bisa dibaca sebagai gambar.'); if (lbl) lbl.textContent = '+ Tambah foto'; };
  img.src = url;
}

/* ---------- ringkasan ---------- */
function vSum(){
  const d = S.D.doc, s = site(d.site), T = docStats(), final = d.status === 'final';
  const rows = parts(d).map(p => { const t = stats(p);
    return `<tr><td class="l">${esc(p.label)}</td><td class="r">${t.done}/${t.total}</td><td class="r">${t.C}</td><td class="r">${t.NC}</td><td class="r">${t.NA}</td><td class="r">${t.ncd}</td><td class="r"><b>${pctTxt(t.pct)}</b></td></tr>`; }).join('');
  const ncs = [];
  parts(d).forEach(p => partItems(d, p).items.forEach(i => { const a = ansOf(p, i.n);
    if (a.d === 'NC' || a.g === 'NC') ncs.push(`<div><b>${esc(p.label)} · ${i.n}. ${esc(i.c)}</b>
      <small>${[a.d === 'NC' ? 'Dokumen NC' : '', a.g === 'NC' ? 'Lapangan NC' : '', a.a ? 'Pelaksana: ' + esc(a.a) : ''].filter(Boolean).join(' · ')}</small>
      <span>${a.f ? esc(a.f) : '<span class="need-msg">Temuan belum diisi</span>'}</span></div>`); }));
  const blockers = [];
  if (T.need) blockers.push(`${T.need} langkah NC belum ada temuan`);
  if (T.done < T.total) blockers.push(`${T.total - T.done} langkah belum lengkap (status dokumen dan lapangan)`);
  $('#view').innerHTML = `
    <div class="crumb"><a href="#" data-go="dokumen">Dokumen audit</a><span>/</span><a href="#" data-go="layanan">${esc(d.no)}</a><span>/</span><span>Ringkasan</span></div>
    <div class="ph"><div><h1>Ringkasan ${esc(s.name)}</h1><p>Compliance resmi dihitung dari status lapangan: C ÷ (C + NC). N/A tidak dihitung.</p></div></div>
    ${docHead()}
    <div class="kpis">
      <div class="card"><small>Compliance lapangan</small><div class="big">${pctTxt(T.pct)}</div></div>
      <div class="card"><small>${isHist(d) ? 'Langkah diaudit' : 'Langkah lengkap'}</small><div class="big">${isHist(d) ? T.C+T.NC+T.NA : T.done}<span style="font-size:15px;color:var(--muted)">/${T.total}</span></div></div>
      <div class="card"><small>NC lapangan</small><div class="big" style="color:var(--nc)">${T.NC}</div></div>
      <div class="card"><small>NC dokumen</small><div class="big" style="color:var(--nc)">${T.ncd}</div></div></div>
    <div class="card tbl"><table><thead><tr><th>Layanan</th><th class="r">Lengkap</th><th class="r">C</th><th class="r">NC</th><th class="r">N/A</th><th class="r">NC dok</th><th class="r">Comply</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card"><div class="thead">Daftar NON-COMPLY (${ncs.length})</div><div class="nclist">${ncs.join('') || '<div><small>Belum ada NC.</small></div>'}</div></div>
    <div id="lockBox">${final ? `<div class="locked">Dikunci ${new Date(d.locked).toLocaleString('id-ID')} oleh ${esc(d.lockedBy)}.</div>`
      : !canWrite() ? '' : `${blockers.length ? `<div class="alert">Belum bisa dikunci: ${blockers.join('; ')}.</div>` : ''}
         <div class="row" style="margin-top:12px"><button class="btn pri" id="lockBtn" type="button" ${blockers.length ? 'disabled' : ''}>Kunci dokumen</button></div>`}</div>
    ${canWrite() ? `<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><b>Ekspor hasil</b>
      <span style="color:var(--muted)">Menyimpan hasil dokumen ini sebagai file JSON di folder Drive aplikasi, untuk diarsipkan ke repo dan dibandingkan di Gap Analysis.</span>
      <div id="expOut"></div><div class="row" style="justify-content:flex-start"><button class="btn" id="expBtn" type="button">Simpan JSON ke Drive</button></div></div>` : ''}`;
  const lb = $('#lockBtn');
  if (lb) lb.onclick = () => { $('#lockBox').innerHTML = `<div class="card pad" style="display:flex;flex-direction:column;gap:12px">
      <b>Kunci ${esc(d.no)}?</b><span style="color:var(--muted)">Setelah dikunci, isian tidak bisa diubah oleh siapa pun.</span><div id="lkErr"></div>
      <div class="row"><button class="btn ghost" id="lkNo" type="button">Batal</button><button class="btn solid" id="lkYes" type="button">Ya, kunci</button></div></div>`;
    $('#lkNo').onclick = vSum;
    $('#lkYes').onclick = async () => { const b = $('#lkYes'); b.disabled = true; b.textContent = 'Mengunci…';
      try { await drain(); S.D = await API('apiLock', d.id); toast('Dokumen dikunci'); vSum(); }
      catch(e){ $('#lkErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false; b.textContent = 'Ya, kunci'; } }; };
  const eb = $('#expBtn');
  if (eb) eb.onclick = async () => { eb.disabled = true; eb.textContent = 'Menyimpan…';
    try { await drain(); const r = await API('apiExport', d.id);
      $('#expOut').innerHTML = `<a class="lnk" href="${esc(r.url)}" target="_blank" rel="noopener">Buka ${esc(r.name)} di Drive</a>`; }
    catch(e){ $('#expOut').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    eb.disabled = false; eb.textContent = 'Simpan JSON ke Drive'; };
}

  $('#view').innerHTML = `<div class="ph"><div><h1>Bantuan</h1><p>Cara memakai form audit di HP.</p></div></div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px;max-width:68ch">

}

/* ---------- shell ---------- */
let tT; function toast(m){ let el = $('.toast'); if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = m; el.hidden = false; clearTimeout(tT); tT = setTimeout(() => el.hidden = true, 3200); }
function closeNav(){ $('#nav').classList.remove('open'); $('#scrim').classList.remove('open'); }
function showUser(){ if (!S.user) return; $('#userEm').textContent = S.user.email;
  $('#userAv').textContent = String(S.user.nama || S.user.email).split(/[\s.@]+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join(''); }
$('#menuBtn').onclick = () => { $('#nav').classList.add('open'); $('#scrim').classList.add('open'); };
$('#navClose').onclick = closeNav; $('#scrim').onclick = closeNav;
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go], .nav a[data-v]'); if (!a) return;
  e.preventDefault(); const v = a.dataset.go || a.dataset.v;
  if (v === 'layanan') refreshDoc();
  go(v);
});
try { google.script.history.setChangeHandler(e => { if (e.state && e.state.v) go(e.state.v, false); }); } catch(e){}
$('#userEm').textContent = ''; $('#userAv').textContent = '…';
go('dokumen');
