<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FEFDFB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Gaya mengacu clay.com (catatan referensi 5 Nov 2026), disesuaikan untuk aplikasi kerja:
   kertas off-white, tinta hitam hangat, krem untuk permukaan sekunder, lime untuk pilihan aktif,
   kartu membulat lega, judul bertracking rapat. Tetap pakai sidebar. Mode terang saja. */
:root{
  color-scheme:light;
  --paper:#FEFDFB; --surface:#FFFFFF; --cream:#F3F2ED; --cream2:#EAE8E0; --line:#E6E3DA; --line2:#D8D4C8;
  --ink:#1D1C1A; --muted:#6B6862; --faint:#9A968D;
  --lime:#CBD810; --lime-soft:#EEF5A6; --blue:#3355FF; --sky:#EAF3FF; --sand:#F0E6D2;
  --ok:#1F8A5B; --ok-bg:#E3F4EA; --nc:#D93025; --nc-bg:#FDECEA; --na:#5F5C56; --na-bg:#F3F2ED;
  --pend:#8A6A00; --pend-bg:#FBF3D2;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --rb:12px; --rc:24px; --rs:18px; --pill:999px; --h:44px;
  --shadow:0 1px 2px rgba(29,28,26,.04),0 8px 24px rgba(29,28,26,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.loading{padding:48px 16px;text-align:center;color:var(--muted)}
.err{background:var(--nc-bg);color:var(--nc);border-radius:var(--rb);padding:12px 14px;font-size:14px;font-weight:500}

/* navbar kapsul melayang */
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;margin:8px max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));
  height:60px;padding:0 10px 0 8px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:var(--pill);box-shadow:var(--shadow)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--cream)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:11.5px;letter-spacing:.02em;display:grid;place-items:center}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;margin-left:4px}
.top .sp{flex:1}
.user{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-width:0}
.user .av{width:36px;height:36px;border-radius:50%;background:var(--lime-soft);color:var(--ink);font-weight:600;font-size:13px;display:grid;place-items:center;flex:none}
.user .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
@media (max-width:560px){.user .em,.brand span{display:none}}

/* sidebar */
.shell{display:flex;min-height:calc(100% - 68px)}
.nav{width:248px;flex:none;padding:20px 12px}
.nav h6{margin:16px 12px 6px;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.01em}
.nav a{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:var(--rb);color:var(--ink);text-decoration:none;font-weight:500;letter-spacing:-.01em}
.nav a:hover{background:var(--cream)}
.nav a.on{background:var(--lime-soft)}
.nav svg{flex:none}
.scrim{display:none}
.navhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.navhead b{font-weight:600;letter-spacing:-.02em}
@media (max-width:1023px){
  .nav{position:fixed;z-index:40;top:0;bottom:0;left:0;width:300px;max-width:86vw;background:var(--surface);transform:translateX(-102%);transition:transform .2s ease;
    padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));border-radius:0 var(--rc) var(--rc) 0;box-shadow:0 0 40px rgba(29,28,26,.18)}
  .nav.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(29,28,26,.35)}
}
@media (min-width:1024px){#menuBtn{display:none}.navhead{display:none}}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}

main{flex:1;min-width:0;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--ink)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding-block:4px}
.ph h1{margin:0;font-size:clamp(28px,4vw,34px);line-height:1.05;font-weight:600;letter-spacing:-.035em;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden}
.pad{padding:18px 20px}

/* tombol: hitam utama, krem sekunder */
.btn{height:var(--h);padding:0 18px;border-radius:var(--rb);border:0;background:var(--cream);color:var(--ink);font-weight:500;letter-spacing:-.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--cream2)}
.btn.pri,.btn.solid{background:var(--ink);color:#fff}
.btn.pri:hover,.btn.solid:hover{background:#000}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--cream);color:var(--ink)}
.btn.block{width:100%;white-space:normal;height:auto;min-height:var(--h);padding-block:11px;text-align:center}
.btn[disabled]{opacity:.4;pointer-events:none}

.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:var(--pill);font-size:12px;font-weight:500;white-space:nowrap}
.p-draft{background:var(--pend-bg);color:var(--pend)} .p-final{background:var(--ok-bg);color:var(--ok)}
.p-opt{background:var(--cream);color:var(--muted)} .p-mdn{background:var(--sky);color:#1C3FAA}
.p-C{background:var(--ok-bg);color:var(--ok)} .p-NC{background:var(--nc-bg);color:var(--nc)} .p-NA{background:var(--cream);color:var(--na)} .p-P{background:var(--pend-bg);color:var(--pend)}

/* daftar dokumen */
.thead{padding:16px 20px 6px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.docs{display:flex;flex-direction:column;padding:4px 8px 8px}
.doc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 12px;border:0;border-radius:var(--rs);background:transparent;text-align:left;width:100%}
.doc + .doc{border-top:1px solid var(--line);border-radius:0 0 var(--rs) var(--rs)}
.doc:hover{background:var(--paper)}
.doc .no{font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.doc .meta{color:var(--muted);font-size:13px;grid-column:1/-1;display:flex;gap:4px 14px;flex-wrap:wrap}
.doc .meta b{color:var(--ink);font-weight:500}
.bar{height:6px;border-radius:var(--pill);background:var(--cream);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ink);border-radius:var(--pill)}
.empty{padding:24px 20px 28px;color:var(--muted)}
.foot{color:var(--faint);font-size:12.5px;text-align:center;margin:8px 0 0}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:500}
.f small{color:var(--muted);font-size:12.5px}
.in{height:var(--h);border:1px solid var(--line2);border-radius:var(--rb);background:var(--surface);padding:0 14px;width:100%}
textarea.in{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--lime-soft)}
.in[readonly]{background:var(--paper);color:var(--muted)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--rb);background:var(--paper)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}
.chk small{display:block;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(29,28,26,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:var(--rc) var(--rc) 0 0;border:0;
  padding:24px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:var(--rc)}}
.sheet h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.03em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* layanan dalam dokumen */
.dochead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px;background:var(--cream);border:0}
@media (max-width:640px){.dochead{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.part{text-align:left;padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);transition:border-color .15s,box-shadow .15s}
.part:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.part h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em}
.part .k{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.part .warn{color:var(--nc);font-size:12.5px;font-weight:500}

/* isi checklist */
.sub{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));z-index:15;background:var(--paper);
  margin:-20px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sub .in2{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.subrow{display:flex;align-items:center;gap:8px;min-width:0}
.subrow .t{flex:1;min-width:0}
.subrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:-.02em}
.subrow .t small{color:var(--muted);font-size:12.5px}
.saved{font-size:12px;color:var(--ok);white-space:nowrap}
.saved.pending{color:var(--muted)}.saved.err{color:var(--nc)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:var(--pill);border:0;background:var(--cream);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--cream2)}
.chip.on{background:var(--lime-soft);color:var(--ink)}
.chip .c{color:var(--muted)}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.sechead{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.sechead b{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.sechead small{color:var(--muted)}
.step{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow:visible}
.step.need{border-color:var(--nc)}
.sh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:32px;height:32px;border-radius:10px;background:var(--cream);font-weight:600;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.step.done .num{background:var(--ink);color:#fff}
.crit{font-weight:500;font-size:16px;line-height:1.4;letter-spacing:-.01em}
.sm{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px;margin-top:6px}
.by{color:var(--faint);font-size:12px;margin-top:2px}
.ans{display:grid;grid-template-columns:80px 1fr;gap:8px 10px;align-items:center}
.ans > span{font-size:13px;font-weight:500;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:46px;border-radius:var(--rb);border:1px solid transparent;background:var(--cream);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{background:var(--cream2)}
.seg button[aria-pressed="true"].C{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].NC{background:var(--nc-bg);border-color:var(--nc);color:var(--nc)}
.seg button[aria-pressed="true"].NA{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.seg button[disabled]{opacity:.5;cursor:default}
.seg button[disabled][aria-pressed="true"]{opacity:1}
.prev{font-size:12.5px;color:var(--muted);background:var(--paper);border-radius:var(--rb);padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.prev q{color:var(--ink);quotes:"\201C" "\201D"}
.more{display:flex;gap:8px;flex-wrap:wrap}
.lnk{border:0;background:transparent;color:var(--ink);font-weight:500;font-size:13.5px;padding:4px 0;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2);cursor:pointer}
.lnk:hover{text-decoration-color:var(--ink)}
.need-msg{color:var(--nc);font-size:12.5px;font-weight:500}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:var(--rb);border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:12px;line-height:1}
.locked{background:var(--ok-bg);color:var(--ok);border-radius:var(--rb);padding:12px 14px;font-weight:500;font-size:14px}

/* ringkasan */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--cream);color:var(--ink);font-weight:500;font-size:13px;text-align:left;padding:12px 16px;white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);white-space:nowrap}
td.l{white-space:normal;min-width:140px}
th.r,td.r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis .card{padding:16px 18px;border:0;background:var(--cream)}
.kpis .card:first-child{background:var(--lime-soft)}
.kpis small{color:var(--muted);font-size:12.5px}
.big{font-size:32px;font-weight:600;line-height:1.1;letter-spacing:-.04em;margin-top:4px;font-variant-numeric:tabular-nums}
.nclist{display:flex;flex-direction:column;padding:0 4px 4px}
.nclist div{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nclist div:first-child{border-top:0}
.nclist b{font-weight:500}
.nclist small{color:var(--muted)}
.alert{border-radius:var(--rb);padding:12px 14px;background:var(--nc-bg);color:var(--nc);font-weight:500;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--rb);font-size:14px;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
.navlink{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Buka menu" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand"><div class="logo">MKT</div><div><b>Audit SOP</b> <span>Warehouse &amp; Multimode</span></div></div>
  <div class="sp"></div>
  <div class="user"><span class="em" id="userEm"></span><div class="av" id="userAv">AU</div></div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Navigasi">
    <div class="navhead"><b>Navigasi</b><button class="iconbtn" id="navClose" aria-label="Tutup menu" type="button">✕</button></div>
    <h6>Audit</h6>
    <a href="#" data-v="dokumen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Dokumen audit</a>

    <a href="<?= alurUrl ?>" target="_top" class="navlink" id="navAlur"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></svg>Business Process</a>
    <a href="#" data-v="bantuan"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Bantuan</a>
  </nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
