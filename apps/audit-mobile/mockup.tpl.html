<title>MKT Audit SOP Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Gaya mengikuti WMS (Ant Design, Plus Jakarta Sans): topbar putih, sidebar/drawer, kartu radius 12, header tabel krem. HP dulu: kartu per langkah. */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --line:#E7E7E7; --line2:#DCDCDC;
  --fg:#0A0A0A; --muted:#6B6B70; --faint:#9A9AA0;
  --brand:#ED1C24; --brand-bg:#FFF1F2; --brand-fg:#FFFFFF;
  --accent:#FDB913; --thead-bg:#FFFBEB; --thead-fg:#461902;
  --ok:#2A9D6F; --ok-bg:#E9F6F0; --nc:#C81E1E; --nc-bg:#FDECEC; --na:#5F6368; --na-bg:#F0F0F2;
  --pend:#8A5A00; --pend-bg:#FFF6DA; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px; --rl:12px; --h:42px; --on-sem:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1B1B1E; --line:#2C2C31; --line2:#3A3A40; --fg:#F2F2F3; --muted:#A4A4AC; --faint:#77777F;
  --brand:#FF4B52; --brand-bg:#3A1619; --brand-fg:#FFFFFF; --accent:#FDB913; --thead-bg:#2A2413; --thead-fg:#F2D9A2;
  --ok:#4CC38A; --ok-bg:#132A20; --nc:#FF6B6B; --nc-bg:#3A1619; --na:#B5B5BD; --na-bg:#26262B; --pend:#F5C451; --pend-bg:#2E2610;
  --shadow:none; --on-sem:#111113; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1B1B1E; --line:#2C2C31; --line2:#3A3A40; --fg:#F2F2F3; --muted:#A4A4AC; --faint:#77777F;
  --brand:#FF4B52; --brand-bg:#3A1619; --brand-fg:#FFFFFF; --accent:#FDB913; --thead-bg:#2A2413; --thead-fg:#F2D9A2;
  --ok:#4CC38A; --ok-bg:#132A20; --nc:#FF6B6B; --nc-bg:#3A1619; --na:#B5B5BD; --na-bg:#26262B; --pend:#F5C451; --pend-bg:#2E2610;
  --shadow:none; --on-sem:#111113; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;height:60px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{width:40px;height:40px;border-radius:var(--r);border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--na-bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-fg);font-weight:700;font-size:12px;display:grid;place-items:center;letter-spacing:.02em}
.brand b{font-size:15px;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap}
.top .sp{flex:1}
.user{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;min-width:0}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--brand-bg);color:var(--brand);font-weight:700;display:grid;place-items:center;flex:none}
.user .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
@media (max-width:560px){.user .em,.brand span{display:none}}

.shell{display:flex;min-height:calc(100% - 60px)}
.nav{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
.nav h6{margin:14px 12px 6px;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:var(--r);color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--na-bg)}
.nav a.on{background:var(--brand-bg);color:var(--brand)}
.nav a.dis{color:var(--faint);pointer-events:none}
.nav svg{flex:none}
.scrim{display:none}
@media (max-width:1023px){
  .nav{position:fixed;z-index:40;top:0;bottom:0;left:0;width:300px;max-width:86vw;transform:translateX(-102%);transition:transform .2s ease;
    padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));box-shadow:0 0 40px rgba(0,0,0,.2)}
  .nav.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45)}
}
.navhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
@media (min-width:1024px){#menuBtn{display:none}.navhead{display:none}}
.navhead b{font-size:15px}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}

main{flex:1;min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--brand)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;line-height:1.25;font-weight:700;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{height:var(--h);padding:0 18px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.pri:hover{filter:brightness(.95);color:var(--brand-fg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.mock{font-size:12px;color:var(--pend);background:var(--pend-bg);border-radius:var(--r);padding:8px 12px}

.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-draft{background:var(--pend-bg);color:var(--pend)} .p-final{background:var(--ok-bg);color:var(--ok)}
.p-ex{background:var(--na-bg);color:var(--na)} .p-opt{background:var(--na-bg);color:var(--na)}
.p-C{background:var(--ok-bg);color:var(--ok)} .p-NC{background:var(--nc-bg);color:var(--nc)} .p-NA{background:var(--na-bg);color:var(--na)} .p-P{background:var(--pend-bg);color:var(--pend)}

/* daftar dokumen */
.docs{display:flex;flex-direction:column}
.doc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
.doc:last-child{border-bottom:0}.doc:hover{background:var(--bg)}
.doc .no{font-weight:700;font-variant-numeric:tabular-nums}
.doc .meta{color:var(--muted);font-size:12.5px;grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap}
.bar{height:6px;border-radius:999px;background:var(--na-bg);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.thead{background:var(--thead-bg);color:var(--thead-fg);font-weight:600;font-size:12.5px;padding:12px 16px;border-radius:var(--rl) var(--rl) 0 0;border-bottom:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600}
.f small{color:var(--muted);font-size:12px}
.in{height:var(--h);border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);padding:0 12px;width:100%}
textarea.in{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-bg)}
.in[readonly]{background:var(--bg);color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.chk small{display:block;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:16px}}
.sheet h2{margin:0;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* bagian */
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.part{text-align:left;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--shadow)}
.part:hover{border-color:var(--brand)}
.part h3{margin:0;font-size:15px}
.part .k{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.part .warn{color:var(--nc);font-size:12px;font-weight:600}
.dochead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.dochead{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.02em}
.kv b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* isi audit */
.sub{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);margin:-20px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sub .in2{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.subrow{display:flex;align-items:center;gap:10px;min-width:0}
.subrow .t{flex:1;min-width:0}
.subrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subrow .t small{color:var(--muted);font-size:12px}
.saved{font-size:11.5px;color:var(--ok);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}
.chip .c{color:var(--muted);font-weight:500}.chip.on .c{color:inherit}
.seg2{display:flex;gap:6px}
.sechead{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sechead b{font-size:15px}
.sechead small{color:var(--muted)}
.step{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.step.need{border-color:var(--nc)}
.sh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--thead-bg);color:var(--thead-fg);font-weight:700;font-size:12.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.step.done .num{background:var(--ok-bg);color:var(--ok)}
.crit{font-weight:600;line-height:1.45}
.sm{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px;margin-top:4px}
.ans{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;align-items:center}
.ans > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:44px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"].C{background:var(--ok);border-color:var(--ok);color:var(--on-sem)}
.seg button[aria-pressed="true"].NC{background:var(--nc);border-color:var(--nc);color:var(--on-sem)}
.seg button[aria-pressed="true"].NA{background:var(--na);border-color:var(--na);color:var(--surface)}
.seg button[disabled]{opacity:.55;cursor:default}
.prev{font-size:12px;color:var(--muted);background:var(--bg);border:1px dashed var(--line2);border-radius:var(--r);padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.prev q{color:var(--fg);quotes:"“" "”"}
.more{display:flex;gap:8px;flex-wrap:wrap}
.lnk{border:0;background:transparent;color:var(--brand);font-weight:600;font-size:12.5px;padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.need-msg{color:var(--nc);font-size:12px;font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:12px;line-height:1}
.locked{background:var(--ok-bg);color:var(--ok);border-radius:var(--r);padding:10px 12px;font-weight:600;font-size:13px}

/* ringkasan */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--thead-bg);color:var(--thead-fg);font-weight:600;font-size:12.5px;text-align:left;padding:12px 14px;white-space:nowrap}
th:first-child{border-top-left-radius:var(--rl)}th:last-child{border-top-right-radius:var(--rl)}
td{padding:12px 14px;border-top:1px solid var(--line);white-space:nowrap}
td.l{white-space:normal;min-width:140px}
th.r,td.r{text-align:right}
.big{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis .card{padding:14px 16px}
.kpis small{color:var(--muted);font-size:12px}
.nclist{display:flex;flex-direction:column}
.nclist div{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nclist div:first-child{border-top:0}
.nclist small{color:var(--muted)}
.alert{border-radius:var(--rl);padding:12px 16px;background:var(--nc-bg);color:var(--nc);font-weight:600;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:60;max-width:90vw}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:18;display:flex;gap:8px}
.fab .btn{box-shadow:0 6px 20px rgba(0,0,0,.18)}
</style>

<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Buka menu" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand"><div class="logo">MKT</div><div><b>Audit SOP</b> <span>Warehouse &amp; Multimode</span></div></div>

  <div class="user"><span class="em" id="userEm"></span><div class="av" id="userAv">AU</div></div>
</header>

  <nav class="nav" id="nav" aria-label="Navigasi">
    <div class="navhead"><b>Navigasi</b><button class="iconbtn" id="navClose" aria-label="Tutup menu" type="button">✕</button></div>
    <h6>Audit</h6>

<script>
const DATA = __DATA__;
const ME = {email:'auditor@kantor (contoh)', init:'AU', name:'Auditor Contoh'};
const KEY = 'mkt-audit-mockup-v1';
const LBL = {C:'Comply', NC:'Non-comply', NA:'N/A', P:'Belum diaudit'};
const SHORT = {C:'C', NC:'NC', NA:'N/A', P:'Pending'};
const SHEETNAME = {TRUCKING:'Trucking Support', EXPORT:'Export', IMPORT:'Import', DC:'Distribution Center', CY:'CY Handling'};
const CAT = {DOC:'Dokumen', OPS:'Operasional', SYS:'Sistem/WMS', COMP:'Kepatuhan'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const site = c => DATA.sites.find(s => s.code === c);
const sheetOf = (c, sh) => DATA.sheets.find(s => s.site === c && s.sheet === sh);

/* ---------- state ---------- */
let S = load();
function load(){
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.docs) return v; } catch(e){}
  return seed();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('Tidak tersimpan: memori browser penuh. Hapus foto contoh atau reset mockup.'); return false; }
}
function seed(){
  const d = newDoc('JKT', '2026-12-08', true);
  d.ex = true;
  const k = 'EXPORT';
  const demo = {1:['C','C',''],2:['C','C',''],3:['C','NC','Jam tiba tidak dicatat di logbook pos'],4:['C','C',''],5:['NA','NA',''],6:['C','C','']};
  d.ans[k] = {};
  for (const [n,[dd,g,f]] of Object.entries(demo)) d.ans[k][n] = {d:dd, g, f, t:Date.now()};
  return {docs:[d], cur:{doc:d.id, part:'EXPORT', sec:'E1'}, seq:7};
}
function newDoc(code, date, isSeed){
  const no = 'FRM-OPS-001-' + String(isSeed ? 6 : S.seq++).padStart(4,'0');
  const s = site(code);
  return {id: 'd' + Date.now() + Math.random().toString(36).slice(2,6), no, site:code, date, auditor:ME.name, email:ME.email,
    partner:'', status:'draft', inc:{cy: code === 'MDN', full:false}, ans:{}, created:Date.now(), upd:Date.now()};
}
const curDoc = () => S.docs.find(d => d.id === S.cur.doc);

/* bagian = layanan (+ unit DC Jakarta) */
function parts(doc){
  const s = site(doc.site), out = [];
  for (const sh of s.sheets){
    if (sh === 'CY' && !doc.inc.cy) continue;
    const units = (s.units || {})[sh];

      <div class="card"><small>NC lapangan</small><div class="big" style="color:var(--nc)">${T.NC}</div></div>
      <div class="card"><small>NC dokumen</small><div class="big" style="color:var(--nc)">${T.ncd}</div></div></div>
    <div class="card tbl"><table><thead><tr><th>Layanan</th><th class="r">Lengkap</th><th class="r">C</th><th class="r">NC</th><th class="r">N/A</th><th class="r">NC dok</th><th class="r">Comply</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card"><div class="thead">Daftar NON-COMPLY (${ncs.length})</div><div class="nclist">${ncs.join('') || '<div><small>Belum ada NC.</small></div>'}</div></div>
    <div id="lockBox">${lock ? `<div class="locked">Dikunci ${new Date(d.locked).toLocaleString('id-ID')} oleh ${esc(d.auditor)}.</div>`
      : `${blockers.length ? `<div class="alert">Belum bisa dikunci: ${blockers.join('; ')}.</div>` : ''}
         <div class="row" style="margin-top:12px"><button class="btn pri" id="lockBtn" type="button" ${blockers.length ? 'disabled' : ''}>Kunci dokumen</button></div>`}</div>`;
  const lb = $('#lockBtn');
  if (lb) lb.onclick = () => { $('#lockBox').innerHTML = `<div class="card pad" style="display:flex;flex-direction:column;gap:12px">
      <b>Kunci ${esc(d.no)}?</b><span style="color:var(--muted)">Setelah dikunci, isian tidak bisa diubah dan hasil dikirim ke Gap Analysis.</span>
      <div class="row"><button class="btn ghost" id="lkNo" type="button">Batal</button><button class="btn pri" id="lkYes" type="button">Ya, kunci</button></div></div>`;
    $('#lkNo').onclick = vSum; $('#lkYes').onclick = () => { d.status = 'final'; d.locked = Date.now(); d.upd = Date.now(); save(); toast('Dokumen dikunci'); vSum(); }; };
}

/* ---------- view: tentang ---------- */
function vAbout(){
  $('#view').innerHTML = `<div class="ph"><div><h1>Tentang mockup</h1><p>Contoh tampilan form audit HP sebelum dibangun di Google Apps Script.</p></div></div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px;max-width:68ch">
      <span>Langkah dan hasil audit sebelumnya diambil dari data audit 2026 (5 cabang). Dokumen <b>Contoh</b> berisi beberapa isian Export Jakarta.</span>
      <span>Di mockup ini isian disimpan di browser HP. Di versi Apps Script, setiap ketukan disimpan ke Google Sheets kantor, foto ke Google Drive, dan nama auditor diambil dari akun Google yang login.</span>
      <span>Dokumen yang dikunci tidak bisa diubah lagi.</span></div>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="reset" type="button">Reset mockup ke data contoh</button></div>`;
  $('#reset').onclick = () => { $('#reset').outerHTML = `<span>Semua isian di HP ini akan dihapus.</span> <button class="btn pri" id="reset2" type="button">Ya, reset</button>`;
    $('#reset2').onclick = () => { S = seed(); save(); toast('Mockup direset'); go('dokumen'); }; };
}

/* ---------- shell ---------- */
let tT; function toast(m){ let el = $('.toast'); if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = m; el.hidden = false; clearTimeout(tT); tT = setTimeout(() => el.hidden = true, 2600); }
function closeNav(){ $('#nav').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#menuBtn').onclick = () => { $('#nav').classList.add('open'); $('#scrim').classList.add('open'); };
$('#navClose').onclick = closeNav; $('#scrim').onclick = closeNav;
$('#userEm').textContent = ME.email; $('#userAv').textContent = ME.init;
window.addEventListener('hashchange', route);
route();
</script>
